name: Deploy Trend Radar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trend-radar-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # This runner lives on the ECS itself. No public SSH access is required.
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='backups' \
            -czf /tmp/trend-radar-release.tar.gz .

      - name: Deploy and verify
        run: |
          set -eu
          mkdir -p /opt/trend-radar
          tar -xzf /tmp/trend-radar-release.tar.gz -C /opt/trend-radar
          cd /opt/trend-radar
          test -f .env
          docker compose up -d --build
          curl -fsS http://127.0.0.1:8080/health
